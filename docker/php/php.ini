memory_limit = 512M
; UPLOAD_LIMIT comes from the root .env via compose (nginx uses it too)
upload_max_filesize = ${UPLOAD_LIMIT}
post_max_size = ${UPLOAD_LIMIT}
date.timezone = UTC

; Symfony performance recommendations
realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Dev-friendly: re-check files on change. For production set to 0.
opcache.validate_timestamps = 1

apc.enable_cli = 1
