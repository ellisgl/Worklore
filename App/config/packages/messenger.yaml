framework:
    messenger:
        # Commands (the write side) go through command.bus. Its handlers are
        # tagged #[AsMessageHandler(bus: 'command.bus')]. Reads don't use a
        # bus: controllers call the modules' query classes directly.
        default_bus: command.bus
        buses:
            command.bus:
                middleware:
                    # One transaction per command: flushed and committed when
                    # the handler returns, rolled back if it throws.
                    - doctrine_transaction
            # Domain events, published after the event store saves them (see
            # App\Shared\EventSourcing\AggregateStore). Inside a command they're
            # held until it commits. Listeners are optional.
            event.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true

        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # async: '%env(MESSENGER_TRANSPORT_DSN)%'
            # failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Route your messages to the transports
            # 'App\Message\YourMessage': async

