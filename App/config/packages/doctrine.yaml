doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # One XML mapping per namespace: each dir holds <ClassShortName>.orm.xml
        # files for classes under its prefix.
        mappings:
            App:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/config/doctrine/Entity'
                prefix: 'App\Entity'
                alias: App
            Company:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Company/Config'
                prefix: 'App\Company'
                alias: Company
            Taxonomy:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Taxonomy/Config'
                prefix: 'App\Taxonomy'
                alias: Taxonomy

when@test:
    doctrine:
        dbal:
            # Database name comes from .env.test as-is; "TEST_TOKEN" is set by ParaTest for parallel runs
            dbname_suffix: '%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
