doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        # Tables Doctrine's schema tools leave alone: they have no ORM mapping
        # and are managed by migrations only. event_store is the event log;
        # the projections an event-sourced module writes join it here.
        schema_filter: '~^(?!(event_store)($|_))~'

        # Typed entity ids (App\Shared\EntityId subclasses), stored as native UUIDs
        types:
            api_token_id: App\Identity\Doctrine\ApiTokenIdType
            category_id: App\Taxonomy\Doctrine\CategoryIdType
            company_id: App\Company\Doctrine\CompanyIdType
            journal_entry_id: App\Journal\Doctrine\JournalEntryIdType
            position_id: App\Company\Doctrine\PositionIdType
            product_id: App\Company\Doctrine\ProductIdType
            project_id: App\Company\Doctrine\ProjectIdType
            tag_id: App\Taxonomy\Doctrine\TagIdType
            user_id: App\Shared\Doctrine\UserIdType
            # App\Shared\Name: trimmed, non-blank, <= 255 characters
            name: App\Shared\Doctrine\NameType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # Modules relate to App\Shared\Owner, not the security user; this is
        # the class Doctrine stores and loads for it.
        resolve_target_entities:
            App\Shared\Owner: App\Identity\User
        # One XML mapping per module: each src/<Module>/Config dir holds
        # <ClassShortName>.orm.xml files for classes under its prefix.
        mappings:
            Company:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Company/Config'
                prefix: 'App\Company'
                alias: Company
            Identity:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Config'
                prefix: 'App\Identity'
                alias: Identity
            Journal:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Journal/Config'
                prefix: 'App\Journal'
                alias: Journal
            Taxonomy:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Taxonomy/Config'
                prefix: 'App\Taxonomy'
                alias: Taxonomy

when@test:
    doctrine:
        dbal:
            # Database name comes from .env.test as-is; "TEST_TOKEN" is set by ParaTest for parallel runs
            dbname_suffix: '%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
