doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        # Tables Doctrine's schema tools leave alone: they have no ORM mapping
        # and are managed by migrations only. event_store is the event log; the
        # rest are the projections the event-sourced modules write.
        # ("position" is quoted: a reserved word.)
        schema_filter: '~^(?!"?(event_store|journal_entry|journal_entry_tag|company|product|project|project_tag|position|category|tag)"?($|_))~'

        # Typed entity ids (App\Shared\EntityId subclasses), stored as native UUIDs
        types:
            api_token_id: App\Identity\Doctrine\ApiTokenIdType
            user_id: App\Shared\Doctrine\UserIdType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # Only Identity (users, sessions) is ORM-mapped; the other modules are
        # event-sourced (App\Shared\EventSourcing) and their tables are
        # projections, outside the mapping (schema_filter above).
        mappings:
            Identity:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Config'
                prefix: 'App\Identity'
                alias: Identity

when@test:
    doctrine:
        dbal:
            # Database name comes from .env.test as-is; "TEST_TOKEN" is set by ParaTest for parallel runs
            dbname_suffix: '%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
