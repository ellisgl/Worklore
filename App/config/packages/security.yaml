security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Loads users via UserRepository::loadUserByIdentifier() (case-insensitive email)
        app_user_provider:
            entity:
                class: App\Entity\User

    # Coarse-grained access. Per-object rules (e.g. "only the owner may edit")
    # belong in voters under src/Security/Voter/.
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider

            # POST /api/auth/login {"email": "...", "password": "..."} -> token pair
            json_login:
                check_path: api_auth_login
                username_path: email
                password_path: password
                success_handler: App\Security\LoginSuccessHandler

            # Authorization: Bearer <access token>
            access_token:
                token_handler: App\Security\AccessTokenHandler
                failure_handler: App\Security\AccessTokenFailureHandler

            # Unauthenticated requests get a 401 with WWW-Authenticate: Bearer
            entry_point: App\Security\ApiEntryPoint

            # Per email+IP and per IP; needs symfony/rate-limiter
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        main:
            lazy: true
            provider: app_user_provider

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/auth/(login|refresh)$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
