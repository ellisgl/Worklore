services:
  nginx:
    image: nginx:${NGINX_VERSION}-alpine
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./App:/var/www/html:ro
      # Rendered to conf.d/default.conf with UPLOAD_LIMIT filled in
      - ./docker/nginx/templates:/etc/nginx/templates:ro
    environment:
      UPLOAD_LIMIT: ${UPLOAD_LIMIT}
      NGINX_ENVSUBST_FILTER: ^UPLOAD_LIMIT$$
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION}
    volumes:
      - ./App:/var/www/html
    environment:
      # Read by App/.env to build DATABASE_URL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Read by App/.env.test
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}
      POSTGRES_TEST_USER: ${POSTGRES_TEST_USER}
      POSTGRES_TEST_PASSWORD: ${POSTGRES_TEST_PASSWORD}
      # Read by php.ini
      UPLOAD_LIMIT: ${UPLOAD_LIMIT}
    depends_on:
      postgres:
        condition: service_healthy
      floci:
        condition: service_healthy
    restart: unless-stopped

  # S3 emulator for journal media in dev (App/.env.dev points media at it).
  # Production uses real object storage, or local disk; see App/.env.
  floci:
    image: floci/floci:${FLOCI_VERSION}-compat   # -compat: has the aws CLI the hook uses
    ports:
      - "${S3_PORT}:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      MEDIA_BUCKET: worklore-media
    volumes:
      # A named volume: Floci runs as UID 1001, which can't write a bind mount here
      - floci-data:/app/data
      # Creates the media bucket once Floci is up
      - ./docker/floci/ready.d:/etc/floci/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_floci/init | grep -q '\"ready\":true'"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:${POSTGRES_VERSION}-alpine
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}
      POSTGRES_TEST_USER: ${POSTGRES_TEST_USER}
      POSTGRES_TEST_PASSWORD: ${POSTGRES_TEST_PASSWORD}
    # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker,
    # so the mount point is the parent directory.
    volumes:
      - ./Data:/var/lib/postgresql
      # Creates the test role/database on first initialization of an empty Data/
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  floci-data:
